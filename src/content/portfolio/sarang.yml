title: "수양회"
order: 5
icon: sarang
role: "신청·배정 전산화 · 총책임자 · 기획·개발·운영"
sections:
  overview:
    - "Google 시트로 받던 1,500명 규모 수양회 신청·재정·소그룹·숙소·셔틀을 시스템으로 옮겼습니다."
    - "총책임자로 설계·구현·운영을 맡았고, 2025년 여름·2026년 겨울·2026년 여름 3회에 적용했습니다."
    - "신청자·실참가자를 새로 단정하지 않고 1,500명 규모로 둡니다."
  stack:
    - "서버·관리자 웹·신청 웹을 분리했습니다. 관리자·신청은 Next.js App Router, 서버는 Knex·PostgreSQL transaction과 역할 테이블입니다."
    - "권한은 admin·role·수양회 assignment로 관리하고, 공개 현황은 개인 명단 없이 count·갱신 시각만 집계합니다."
    - "셔틀 상태 계산은 서버에 두고 탑승자 조회와 조합합니다."
  problem:
    - "기존에는 시트 신청과 수동 재정·배정이 이어져 운영 피로가 컸고, 일정 변동은 구두 인수인계에만 의존해 정형화된 프로세스가 없었습니다."
  decision:
    - "없던 일정 변동 프로세스를 재정, 라인업, 인원관리 순으로 정형화하고, 일정 변동 이력 조회·처리 기능을 만들었습니다."
    - "신청·배정 화면을 운영 순서에 맞추고 관리자 권한을 시스템으로 먼저 옮겼습니다."
  outcome:
    - "1,500명 규모에 3회 적용했고, 500명대 규모에도 3회 적용했습니다."
    - "자동화로 운영 피로가 줄었다는 정성 관찰이 있으며 시간·오류율은 정량화하지 않습니다."
  retro:
    - "기능 목록보다 이해관계자를 설득하고 운영 이관·변동 순서를 먼저 고정한 뒤 책임을 지는 편이 중요했습니다."
    - "구두로만 넘기던 일정 변동을 프로세스로 남기니 인수인계와 대응이 짧아졌습니다."
