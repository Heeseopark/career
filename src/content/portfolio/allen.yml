title: "알렌의 서재"
order: 1
icon: allen
role: "보건의료 교육 플랫폼 백엔드, AI · 2024.05.~현재"
sections:
  overview:
    - "리비바이오 알렌의 서재에서 백엔드를 맡았고, 2026년 3월부터 AI 기능을 단독으로 설계, 구현했습니다."
    - "중심 산출은 Vector RAG 멀티턴 AI 채팅입니다. 2026년 4월 상용 출시했습니다."
  stack:
    - "TypeScript, LangChain, OpenSearch kNN, Node.js, PostgreSQL을 사용했습니다."
    - "채팅은 세션, 스트리밍, 재생성으로 구성하고, 의학 콘텐츠는 chunk 단위 임베딩 인덱스에 동기화했습니다. 모델은 A/B와 fallback chain을 둡니다."
  problem:
    - "교육 콘텐츠를 대화에 넣으면서 재현성과 질문 범위를 같이 지켜야 했습니다."
    - "검증용 컨텍스트와 응답용 컨텍스트를 분리하고, 문항 채팅 컨텍스트는 스냅샷으로 남겨 이력을 재현할 수 있게 했습니다."
  decision:
    - "질문을 허용, 안내, 차단으로 나누는 사전 필터를 채팅 앞에 두었습니다."
    - "AI LAB 문항, 해설 생성은 단계형 파이프라인(STEP)에서 tool 기반 Agent로 전환하고, 둘 중 선택해 실행할 수 있게 했습니다."
    - "검색 본문은 HTML 대신 Markdown으로 넘겨 컨텍스트를 줄였습니다."
  outcome:
    - "멀티턴 채팅을 상용 배포했습니다."
    - "검색 컨텍스트를 Markdown으로 바꾼 뒤 context 길이는 약 53%, input token은 약 40% 줄었습니다."
    - "국시 내분비 온톨로지 Graph 검색 PoC에서, 같은 키워드 추출 단계의 Vector RAG 대비 Hit@3 +12.5~21.6%p, F1 +12.1~14.6%p였습니다. gpt-5-nano 기준 Hit@3는 61.7%에서 74.2%로 올랐습니다."
  retro:
    - "고정 평가셋, trace, 블라인드 비교를 요구사항으로 잡아야 검색 파라미터를 반복해서 고칠 수 있었습니다."
    - "세부 수치와 화면 흐름은 이 페이지에 두고, 이력서는 초단문만 남겼습니다."
