introduce:
  - "**TypeScript 기반 AI 애플리케이션과 백엔드를 개발하는 3년차 개발자입니다.**"
  - "보건의료 교육 플랫폼 **알렌의 서재**에서 2026년 3월부터 LangChain 기반 **Vector RAG 멀티턴 AI 채팅을 단독으로 설계, 구현**해 상용 출시하고, 콘텐츠 생성 파이프라인의 Agent 전환과 Slack 에이전트용 MCP 조회 도구를 구현했습니다. 의료 도메인 온톨로지, 지식그래프 PoC와 검색 품질 평가도 수행했습니다."
  - "의학 도메인에서 온톨로지, 지식그래프로 개념과 추론 관계를 구조화해 검색, 대화에 연결한 경험을, 회계, 세무 기준과 업무 절차를 구조화하는 일로 이어가고 싶습니다. 이를 바탕으로 삼일PwC AX Node에서 도메인 특화 Agent, RAG를 만들고, 나아가 사무직 업무 자동화를 구현하는 데 기여하고자 합니다."

projects:
  - title: "알렌의 서재"
    icon: allen
    meta: "보건의료 교육 플랫폼 · 리비바이오 · 백엔드 개발 · 2024.05.~현재 · AI 기능 개발 2026.03.~"
    items:
      - lines:
          - "**Vector RAG 기반 멀티턴 AI 채팅 - 단독 구현, 2026.04 상용**"
          - "멀티턴 세션, 스트리밍, 재생성 백엔드를 설계, 구현."
          - "질문을 허용, 안내, 차단으로 분류하는 사전 필터(Preflight guardrail) 적용."
          - "OpenAI, Gemini 모델 A/B(weight 기반)와 장애 시 fallback chain, 이미지, PDF, 문서 멀티모달 입력, LLM 호출 단위 감사 로그 구축."
          - "사용자 프롬프트 **검증용 컨텍스트와 응답용 컨텍스트를 분리**."
          - "문항 채팅 컨텍스트는 스냅샷으로 저장해 재현성과 이력을 관리."
      - lines:
          - "**Vector RAG, tool 기반 검색 - OpenSearch kNN**"
          - "의학 콘텐츠(개념, 이론, 문항)를 chunk 단위로 OpenSearch kNN 임베딩 인덱스에 동기화."
          - "연관 콘텐츠, 출제 이력 조회를 LLM tool로 제공."
          - "평가 sweep 결과로 검색 파라미터(limit, threshold 등)를 조정하고, 검색 본문을 Markdown으로 변환해 컨텍스트 경량화."
      - lines:
          - "**LLM 일회성 호출 계층**"
          - "structured output, 모델 fallback, 호출 감사 로그를 공통화."
          - "멀티턴 사용자 프롬프트 검증과 대화 컨텍스트 기반 암기카드 후보 생성 등에 재사용."
      - lines:
          - "**AI LAB 문항, 해설 생성 - 단계형 파이프라인에서 Agent로 전환**"
          - "콘텐츠팀용 문항, 해설 대량 생성 파이프라인(STEP)을 구현."
          - "임베딩 검색, 용어 조회, web search를 tool registry로 묶은 Agent 실행 모드로 전환(STEP/AGENT 선택 가능)."
          - "백오피스 호출을 **STEP 기반에서 Agent 기반으로 개선**."
          - "bounded worker pool(동시성 100)과 stale recovery로 비동기 배치 처리 안정화."
      - lines:
          - "**Slack 상주 Agent, MCP - NanoClaw 조회 도구와 콘텐츠 MCP 서버**"
          - "Slack 상주 Agent(NanoClaw)에 사람 승인, SQL 가드레일 기반 Athena 데이터베이스 조회와 학습 이벤트(LIS) 로그 조회 도구를 추가."
          - "이와 별도로 사내 콘텐츠 작업(문제 업로드, 검수 등)을 돕는 MCP 서버를 단독 개발."
      - lines:
          - "**의료 도메인 온톨로지, 지식그래프 - PoC 및 검색 평가**"
          - "의료(국시 내분비) 도메인 온톨로지 기반 Graph 검색 PoC를 설계."
          - "Vector RAG와 키워드 추출 단계를 동일하게 맞춘 관련 이론 검색 평가에서 키워드 모델 3종 모두 **Hit@3 +12.5~21.6%p, F1 +12.1~14.6%p 개선**을 확인(gpt-5-nano 기준 Hit@3 61.7%→74.2%)."
      - lines:
          - "**AI 품질 평가 체계 설계**"
          - "고정 평가 데이터셋과 개선 전후 비교, trace(키워드, 검색 결과, tool 호출, 응답) 조회, 재실행, 블라인드 평가로 이어지는 평가, 개선 루프의 요구사항 설계."
      - lines:
          - "**검색 컨텍스트 HTML→Markdown 변환**"
          - "연관 콘텐츠 tool 출력을 LLM용 Markdown으로 바꿔 불필요 태그를 줄임."
          - "배포 후 context 길이 약 53%, input token 약 40% 감소."
      - lines:
          - "**학습 이벤트 수집 파이프라인 - 상용 배포**"
          - "학습 행동 분석용 이벤트 수집 API와 **SQS, Lambda, S3**, Athena 기반 적재, 정제 파이프라인 개발, 상용 배포 후 수집, 적재 확인."
      - lines:
          - "**결제, 이용권 구조 개편**"
          - "**데이터 구조 개선**, 전반 **기획 리뷰**, **구현, 단계적 배포**(기존 클라이언트 호환), **운영**까지 담당."
          - "Ex) 결제, 이용권 구조 개편, 학습 모듈 분리, 데이터 이관, OpenSearch 검색 개선, SEO, 사이트맵, 소유권 lazy sync, 이론, 하이라이트 버전 관리, 이관."

