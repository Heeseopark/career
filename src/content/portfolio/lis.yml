title: "LIS"
order: 3
role: "학습 이벤트 수집, 적재 · SQS, Lambda, S3, Athena · 상용 배포"
sections:
  overview:
    - "알렌의 서재 학습 행동을 분석하려고 이벤트 수집 API와 적재, 정제 파이프라인을 만들어 상용에 배포했습니다."
    - "채팅 RAG와 분리된 경로입니다. 수집이 확인된 뒤 적재까지 이어지는지만 운영에서 봤습니다."
  stack:
    - "구성은 수집 API, 큐, 비동기 처리, 객체 저장, 조회 순입니다. 서비스 이름은 SQS, Lambda, S3, Athena입니다."
    - "API는 이벤트를 받아들이고, 이후 단계는 큐 뒤로 넘깁니다. 계정, 버킷, 테이블 이름은 적지 않습니다."
  problem:
    - "학습 클릭과 조회가 대화 요청과 한 저장소에 섞이면 장애와 분석이 같이 멈춥니다."
    - "유실 없이 쌓고, 나중에 질문할 수 있는 형태로 정제해야 했습니다."
  decision:
    - "API는 접수만 하고 적재는 비동기로 뒀습니다."
    - "원본 저장과 정제, 조회를 나눠 수집 장애가 분석 스키마 변경을 막지 않게 했습니다."
  outcome:
    - "상용 배포 후 수집과 적재를 확인했습니다."
    - "호출량, 비용 같은 운영 숫자는 공개하지 않습니다."
  retro:
    - "경계를 파이프라인으로 고정하니 RAG 컨텍스트 경량화와 학습 로그 수집을 따로 개선할 수 있었습니다."
