title: "무물"
order: 4
icon: mumul
role: "AI 수능 학습 앱 · 개인 · 2026.10 출시"
sections:
  overview:
    - "국어·수학·영어 AI 학습 앱을 기획·개발해 출시했습니다."
    - "단순 오답 지점 찾기에 머물지 않고 해설·풀이 분석·단계 학습·출제 의도까지 확장했습니다."
    - "강조 기술은 프롬프트 기반 풀이 개선, 자식 대화, 커스텀 컴포넌트입니다. 사용자 수는 적지 않습니다."
  stack:
    - "주력은 추론 파이프라인과 PDF 문항 데이터 준비입니다."
    - "추론은 이미지, 검증·전사/vision, 유형별 prompt·풀이, UIMessage stream, 앱 렌더링 순입니다."
    - "부모에서 자식으로는 원문·전사·기준 답변·기능 입력을, 자식에서 부모로는 구조화 handoff를 전달합니다."
    - "PDF 도구는 render, layout, crop, 분류, 문항별 QA, manifest로 평가용 이미지를 준비합니다. 여기에 맞춰 LLM 성능을 측정하는 평가 파이프라인으로 유형·세트를 돌려 개선을 반복합니다."
  problem:
    - "유형마다 필요한 분석이 달라 한 공통 응답으로 부족합니다."
    - "모델·프롬프트·라우팅을 바꿔도 성능을 같은 기준으로 재현·비교할 평가 파이프라인이 없으면 개선이 감에 의존합니다."
    - "참조 지문 누락, 손상 전사인데 vision 없이 풀이하는 라우팅, 중단·빈 응답이 READY로 보이는 문제도 같은 평가 루프 안에서 잡아야 했습니다. PDF는 실행 완료와 품질 통과를 분리해야 했습니다."
  decision:
    - "학습 상호작용을 풀이 분석, 한 단계 같이 풀어보기, 평가원 의도 분석으로 나누고 자식·부모 handoff로 구현했습니다."
    - "child는 기존 conversation·streaming을 재사용하고 상태 테이블로 확장합니다."
    - "solver를 무작정 바꾸지 않고 입력·전사·routing·parser 실패를 나눠 조사했고, 채점·평가는 저장된 완료 응답과 고정 세트로 돌립니다."
  outcome:
    - "앱 출시를 완료했습니다."
